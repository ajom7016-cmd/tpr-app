<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/assets/tailwind-compiled.css?v=3.1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPR Profile Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL,GRAD,opsz@400,0,0,24" rel="stylesheet" />
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            background-color: transparent;
        }

        .header-btn {
            width: 48px; height: 48px; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.6); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 8px 20px rgba(0,0,0,0.04); transition: transform 0.2s;
        }
        .header-btn:active { transform: scale(0.9); }

        .glass-group {
            background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.3) 100%);
            backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03), inset 0 2px 10px rgba(255,255,255,0.4);
            border-radius: 20px; overflow: hidden;
        }

        .input-row {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(226,232,240,0.6);
            display: flex; flex-direction: column; gap: 4px;
        }
        .input-row:last-child { border-bottom: none; }

        .input-label {
            font-size: 11px; font-weight: 700; color: #64748b;
            text-transform: uppercase; letter-spacing: 0.05em;
        }

        .input-field {
            width: 100%; font-size: 16px; font-weight: 600; color: #1e293b;
            background: transparent; border: none; outline: none; padding: 4px 0;
            font-family: inherit;
        }
        .input-field:focus {
            color: #ea580c; /* Orange focus */
        }
        .input-field:read-only {
            color: #1e293b;
        }
        .input-field:disabled {
            color: #94a3b8; font-weight: 500;
        }

        .avatar-edit {
            position: absolute; bottom: 0; right: 0;
            width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; border: 3px solid white; box-shadow: 0 4px 10px rgba(16,185,129,0.3);
            cursor: pointer;
        }

        .btn-save {
            width: 100%; padding: 18px; border-radius: 20px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white; font-size: 16px; font-weight: 700; border: none;
            box-shadow: 0 10px 25px rgba(234,88,12,0.3);
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
        }
        .btn-save:active { transform: scale(0.97); }
        .btn-disabled {
            background: #cbd5e1 !important; color: #94a3b8 !important; 
            box-shadow: none !important; cursor: not-allowed;
            transform: none !important;
        }

        .edit-icon-btn {
            width: 28px; height: 28px; border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(226, 232, 240, 0.5); cursor: pointer; transition: all 0.2s;
        }
        .edit-icon-btn:active { transform: scale(0.9); background: #cbd5e1; }

        .error-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    
    


    /* === ULTRA-FAST 0.15s NO-LAG GPU NATIVE ENTRANCE === */
    @keyframes fastNativeEntrance {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    body {
        animation: fastNativeEntrance 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
        will-change: opacity, transform;
    }
    </style>

<body class="pb-28 pt-2 relative overflow-x-hidden text-slate-800" style="overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch;" style="background: transparent !important; background-color: transparent !important;">
    <!-- Back Button (Static) -->
    <div class="mb-4 mt-2 ml-2 flex-none relative z-50">
        <button class="text-slate-500 hover:text-slate-900 bg-white/70 hover:bg-white/95 backdrop-blur-xl rounded-full shadow-[0_4px_15px_rgba(0,0,0,0.08)] border border-white/80 flex items-center p-2 transition-all duration-300 hover:scale-110 active:scale-95" onclick="window.parent.loadPage('user_profile_premium_glass/code.html', null)">
            <span class="material-symbols-outlined text-[20px] ml-[-2px]">arrow_back_ios_new</span>
        </button>
    </div>
    

    
    

    
                <div class="max-w-[400px] mx-auto px-6 relative z-10 space-y-8">
        <div class="px-6 mb-8 flex items-center justify-center relative z-10 w-full">
        <h1 class="text-[24px] font-black text-slate-800 tracking-tight text-center">Edit Profile</h1>
    </div>
        <div class="flex flex-col items-center mt-2 mb-6">
            <div class="relative mb-4">
                <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-white shadow-lg relative z-10">
                    <img src="https://i.pravatar.cc/300?u=a042581f4e29026704d" id="prof-avatar" class="w-full h-full object-cover">
                </div>

                
            </div>
            
        </div>
        
        <!-- Error Message -->
        <div id="error-msg" class="hidden bg-red-100 text-red-600 text-[13px] font-bold p-3 rounded-xl border border-red-200 text-center flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-[18px]">error</span> <span id="error-text"></span>
        </div>

        <!-- Personal Info -->
        <div>
            <p class="text-[12px] font-black text-slate-400 uppercase tracking-widest pl-2 mb-3">Account Details</p>
            <div class="glass-group">
                <div class="input-row relative">
                    <span class="input-label">Full Name</span>
                    <div class="flex items-center">
                        <input type="text" id="prof-name" class="input-field" placeholder="Loading..." readonly>
                        <div class="edit-icon-btn" onclick="unlockField('prof-name')">
                            <span class="material-symbols-outlined text-[16px] text-slate-500">edit</span>
                        </div>
                    </div>
                </div>
                <div class="input-row relative">
                    <span class="input-label">Email Address</span>
                    <div class="flex items-center">
                        <input type="email" id="prof-email" class="input-field" placeholder="Loading..." readonly>
                        <div class="edit-icon-btn" onclick="unlockField('prof-email')">
                            <span class="material-symbols-outlined text-[16px] text-slate-500">edit</span>
                        </div>
                    </div>
                </div>
                <div class="input-row relative">
                    <span class="input-label">Registered Phone</span>
                    <div class="flex items-center gap-2 mt-1">
                        <input type="tel" id="prof-phone" class="input-field text-slate-500" value="Loading..." disabled style="padding:0;">
                        <div class="bg-emerald-100 text-emerald-600 text-[10px] font-black px-2 py-1 rounded-md flex items-center gap-1 uppercase tracking-wider shrink-0">
                            <span class="material-symbols-outlined text-[12px]">verified</span> Verified
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button id="save-btn" class="btn-save btn-disabled" disabled onclick="saveProfile()">Save Changes</button>

    </div>

    <!-- Hidden Canvas for Cropping/Resizing -->
    <canvas id="crop-canvas" class="hidden"></canvas>

    <script>
        
        function getToken() {
            let t = null;
            try { t = (() => { try { return window.parent.localStorage.getItem('userToken'); } catch(e) { return localStorage.getItem('userToken'); } })(); } catch(e) {}
            if (!t) { try { t = localStorage.getItem('userToken'); } catch(e) {} }
            return t;
        }

        let currentProfile = null;

        

        // Load Profile Data
                // Load Profile Data
                // Load Profile Data
        async function loadData() {
            try {
                let token = getToken();
                
                if(!token) {
                    window.parent.location.href = '/login.html';
                    return;
                }

                const res = await fetch('/api/profile?t=' + new Date().getTime(), {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if(res.ok) {
                    currentProfile = await res.json();
                    document.getElementById('prof-name').value = currentProfile.name || 'No Name';
                    document.getElementById('prof-email').value = currentProfile.email || 'No Email';
                    document.getElementById('prof-phone').value = currentProfile.phone || 'No Phone';
                    
                    const headerName = document.getElementById('header-name');
                    if (headerName && currentProfile.name) {
                        headerName.innerText = currentProfile.name;
                    }
                    
                    checkLock();
                } else if (res.status === 401 || res.status === 403) {
                    // Token expired or invalid
                    try { window.parent.localStorage.removeItem('userToken'); } catch(e) {}
                    try { localStorage.removeItem('userToken'); } catch(e) {}
                    window.parent.location.href = '/login.html';
                } else {
                    document.getElementById('prof-name').value = 'API Error: ' + res.status;
                }
            } catch(e) {
                console.error("Profile load error:", e);
            }
        }
        
        
        loadData();

        function unlockField(id) {
            const input = document.getElementById(id);
            input.removeAttribute('readonly');
            input.focus();
            
            // Move cursor to end
            const val = input.value;
            input.value = '';
            input.value = val;
        }

        function checkChanges() {
            if(!currentProfile) return;
            const name = document.getElementById('prof-name').value.trim();
            const email = document.getElementById('prof-email').value.trim();
            
            const btn = document.getElementById('save-btn');
            if(name !== currentProfile.name || email !== currentProfile.email) {
                btn.removeAttribute('disabled');
                btn.classList.remove('btn-disabled');
            } else {
                btn.setAttribute('disabled', 'true');
                btn.classList.add('btn-disabled');
            }
        }

        document.getElementById('prof-name').addEventListener('input', checkChanges);
        document.getElementById('prof-email').addEventListener('input', checkChanges);

        // Save Profile
        async function saveProfile() {
            const btn = document.getElementById('save-btn');
            const errorBox = document.getElementById('error-msg');
            const name = document.getElementById('prof-name').value.trim();
            const email = document.getElementById('prof-email').value.trim();

            errorBox.classList.add('hidden');
            
            if(!name || !email) {
                showError("Name and Email cannot be empty.");
                return;
            }

            btn.innerHTML = '<span class="material-symbols-outlined animate-spin align-middle">progress_activity</span>';
            
            try {
                const token = getToken();
                const response = await fetch('/api/update-profile', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ name, email })
                });
                
                const res = await response.json();
                
                if(res && res.success) {
                    btn.innerHTML = '<span class="material-symbols-outlined text-white mr-2">check_circle</span> Saved';
                    currentProfile.name = name;
                    currentProfile.email = email;
                    if(res.profile_changed_at) currentProfile.profile_changed_at = res.profile_changed_at;
                    currentProfile.profile_changed_at = new Date().toISOString();
                    
                    // Lock fields again
                    document.getElementById('prof-name').setAttribute('readonly', 'true');
                    document.getElementById('prof-email').setAttribute('readonly', 'true');
                    
                    setTimeout(() => {
                        checkLock(); // Apply UI Lock
                    }, 2000);
                } else {
                    showError(res.error || "Failed to update.");
                    btn.innerHTML = 'Save Changes';
                }
            } catch(e) {
                showError("Network error. Try again.");
                btn.innerHTML = 'Save Changes';
            }
        }

        // Instant Lock UI from Backend Timestamp
        function checkLock() {
            if(!currentProfile || !currentProfile.profile_changed_at) return;
            
            const lastChanged = new Date(currentProfile.profile_changed_at);
            const now = new Date();
            const diffTime = now - lastChanged;
            const diffDays = diffTime / (1000 * 60 * 60 * 24);
            
            if (diffDays <= 3) {
                const remaining = Math.ceil(3 - diffDays);
                // Already locked
                document.getElementById('prof-name').setAttribute('disabled', 'true');
                document.getElementById('prof-email').setAttribute('disabled', 'true');
                
                // Hide edit icons
                const editIcons = document.querySelectorAll('.edit-icon-btn');
                editIcons.forEach(i => i.style.display = 'none');
                
                // Change Button to Red Lock
                const btn = document.getElementById('save-btn');
                btn.setAttribute('disabled', 'true');
                btn.classList.add('btn-disabled');
                btn.style.background = '#fee2e2'; // red-100
                btn.style.color = '#ef4444'; // red-500
                btn.innerHTML = `<span class="material-symbols-outlined mr-2">lock</span> Locked (${remaining} days left)`;
            }
        }

        function showError(msg) {
            const box = document.getElementById('error-msg');
            document.getElementById('error-text').innerText = msg;
            box.classList.remove('hidden');
            box.classList.remove('error-shake');
            void box.offsetWidth; // trigger reflow
            box.classList.add('error-shake');
        }
    </script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const savedPic = localStorage.getItem('userProfilePic');
        const profAvatar = document.getElementById('prof-avatar');
        if (savedPic && profAvatar) {
            profAvatar.src = savedPic;
        }
    });

    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'UPDATE_AVATAR') {
            const profAvatar = document.getElementById('prof-avatar');
            if (profAvatar) {
                profAvatar.src = event.data.src;
            }
        }
    });
</script>

</body>
</html>
