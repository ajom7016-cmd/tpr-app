<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Two-Factor Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL,GRAD,opsz@400,1,0,24" rel="stylesheet" />
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            background-color: transparent;
        }

        .header-btn {
            width: 48px; height: 48px; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.6); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            color: #1e293b; transition: transform 0.2s;
        }
        .header-btn:active { transform: scale(0.9); }

        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.1) 100%);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 35px rgba(0,0,0,0.05), inset 0 2px 10px rgba(255,255,255,0.4);
            border-radius: 24px;
            padding: 24px;
        }

        .pin-box {
            width: 45px; height: 55px;
            background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.3) 100%);
            backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255,255,255,0.8);
            border-bottom: 2px solid rgba(255,255,255,0.5);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05), inset 0 2px 5px rgba(255,255,255,0.5);
            border-radius: 12px;
            font-size: 24px; font-weight: 900;
            text-align: center; color: #1e293b;
            outline: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pin-box:focus {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.95);
            border-color: #94a3b8;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05), 0 0 0 3px rgba(148,163,184,0.1);
        }

        .btn-primary {
            width: 100%; padding: 18px; border-radius: 20px;
            background: linear-gradient(135deg, rgba(255, 122, 0, 0.95) 0%, rgba(249, 115, 22, 0.85) 100%);
            backdrop-filter: blur(20px);
            color: #ffffff; font-size: 18px; font-weight: 900;
            border: 1px solid rgba(255, 255, 255, 0.4);
            outline: none; transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05), inset 0 2px 5px rgba(255, 255, 255, 0.4);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 24px;
            opacity: 0.5; pointer-events: none;
        }
        .btn-primary.active { opacity: 1; pointer-events: auto; }
        .btn-primary.active:active { transform: scale(0.97); }

        .copy-box {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03), inset 0 2px 10px rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            text-align: left;
            cursor: pointer;
        }

        /* Error Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake-error {
            animation: shake 0.4s ease-in-out;
        }
        .error-border {
            border-color: #ef4444 !important;
        }

        /* Login Page Bouncing Dots Animation */
        .bouncing-dots {
            display: flex; justify-content: center; align-items: center; gap: 7px; height: 24px;
        }
        .bouncing-dots div {
            width: 6px; height: 6px; background-color: transparent !important; border-radius: 10px;
            animation: stretch-bounce 1s infinite ease-in-out both;
        }
        .bouncing-dots div:nth-child(1) { animation-delay: -0.32s; }
        .bouncing-dots div:nth-child(2) { animation-delay: -0.16s; }
        .bouncing-dots div:nth-child(3) { animation-delay: 0s; }
        @keyframes stretch-bounce {
            0%, 80%, 100% { height: 6px; }
            40% { height: 20px; }
        }
    
    


    /* === ULTRA-FAST 0.15s NO-LAG GPU NATIVE ENTRANCE === */
    @keyframes fastNativeEntrance {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    body {
        animation: fastNativeEntrance 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
        will-change: opacity, transform;
    }
    </style>





























<style id="custom-global-scrollbar">

  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.25); border-radius: 7px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.4); }

  }

</head>
<body class="pb-28 pt-2 relative overflow-x-hidden text-slate-800" style="overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch;" style="background: transparent !important; background-color: transparent !important;">

    <!-- Back Button (Static) -->
    <div class="mb-4 mt-2 ml-2 flex-none relative z-50">
        <button class="text-slate-500 hover:text-slate-900 bg-white/70 hover:bg-white/95 backdrop-blur-xl rounded-full shadow-[0_4px_15px_rgba(0,0,0,0.08)] border border-white/80 flex items-center p-2 transition-all duration-300 hover:scale-110 active:scale-95" onclick="window.parent.loadPage('security_glass/code.html', null)">
            <span class="material-symbols-outlined text-[20px] ml-[-2px]">arrow_back_ios_new</span>
        </button>
    </div>
    

    
    </div>

    <div class="max-w-[400px] mx-auto px-6 relative z-10">
        
        <div class="px-6 mb-6 flex items-center justify-between relative z-20">
            <h1 class="text-[20px] font-black text-slate-800 tracking-tight text-center w-full">Two-Factor Auth</h1>
        </div>
<div id="setupCard" class="glass-card mb-6 text-center relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-slate-200/50 rounded-full blur-2xl"></div>
            
            <p class="text-[13px] font-bold text-slate-500 mb-6 px-4">Use Google Authenticator to scan this QR code or enter the setup key.</p>
            
            <div class="bg-white p-2 rounded-2xl shadow-sm inline-block mb-6 border border-slate-200">
                <img src="" class="rounded-xl w-[160px] h-[160px]" id="qrImage">
            </div>

            <div class="copy-box active:scale-[0.98] transition-transform" onclick="copyKey()">
                <div class="overflow-hidden">
                    <p class="text-[14px] font-bold text-slate-800 truncate" id="displayKey">Loading...</p>
                    <p class="text-[12px] font-semibold text-slate-500 mt-0.5">Setup Key</p>
                </div>
                <button class="w-10 h-10 rounded-full bg-transparent text-slate-800 flex items-center justify-center flex-shrink-0 ml-2 hover:bg-black/5 transition-colors">
                    <span id="copyIcon" class="material-symbols-outlined text-[22px]">content_copy</span>
                </button>
            </div>
        </div>

        <div id="verifySection">
            <p id="verifyText" class="text-[12px] font-black text-slate-400 uppercase tracking-widest pl-2 mb-3">Verify 6-Digit Code</p>
            
            <div class="flex justify-between gap-2 mb-2" id="pin-container">
                <input type="text" class="pin-box" maxlength="1" oninput="moveToNext(this, 1)" onkeydown="checkBackspace(event, 1)" inputmode="numeric">
                <input type="text" class="pin-box" maxlength="1" oninput="moveToNext(this, 2)" onkeydown="checkBackspace(event, 2)" inputmode="numeric" disabled>
                <input type="text" class="pin-box" maxlength="1" oninput="moveToNext(this, 3)" onkeydown="checkBackspace(event, 3)" inputmode="numeric" disabled>
                <input type="text" class="pin-box" maxlength="1" oninput="moveToNext(this, 4)" onkeydown="checkBackspace(event, 4)" inputmode="numeric" disabled>
                <input type="text" class="pin-box" maxlength="1" oninput="moveToNext(this, 5)" onkeydown="checkBackspace(event, 5)" inputmode="numeric" disabled>
                <input type="text" class="pin-box" maxlength="1" oninput="moveToNext(this, 6)" onkeydown="checkBackspace(event, 6)" inputmode="numeric" disabled>
            </div>
            
            <button class="btn-primary" id="saveBtn" onclick="verifyAndEnable()">
                Enable 2FA
                <span class="material-symbols-outlined text-[20px] font-bold">security</span>
            </button>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsSHA/2.3.1/sha.js"></script>
    <script>
        const inputs = document.querySelectorAll('.pin-box');
        const saveBtn = document.getElementById('saveBtn');
        const pinContainer = document.getElementById('pin-container');
        
        let is2FAEnabled = localStorage.getItem('tpr_2fa_enabled') === 'true';

        // Check if already enabled to show "Disable" flow
        if (is2FAEnabled) {
            document.getElementById('pageTitle').innerText = "Disable 2FA";
            document.getElementById('setupCard').style.display = "none";
            document.getElementById('verifyText').innerText = "Enter Code to Disable";
            document.getElementById('saveBtn').innerHTML = `Disable 2FA <span class="material-symbols-outlined text-[20px] font-bold">security_off</span>`;
            document.getElementById('verifySection').classList.add('mt-12');
        }
        
        // Generate a random, unique Base32 Secret Key for every user
        function generateBase32Secret(length = 16) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            let secret = '';
            for(let i = 0; i < length; i++) {
                secret += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return secret;
        }

        // Get or create unique secret for the current user
        let secretKey = localStorage.getItem('tpr_2fa_secret');
        if (!secretKey) {
            secretKey = generateBase32Secret();
            localStorage.setItem('tpr_2fa_secret', secretKey);
        }

        // Dynamically update the QR Code and Display Key for the unique user
        document.getElementById('displayKey').innerText = secretKey;
        document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=otpauth://totp/TPR_App:User?secret=${secretKey}&issuer=TPR_App`;

        function moveToNext(input, index) {
            input.value = input.value.replace(/[^0-9]/g, '');
            if(input.value.length === 1 && index < inputs.length) {
                inputs[index].disabled = false;
                inputs[index].focus();
            }
            checkFull();
        }

        function checkBackspace(e, index) {
            if(e.key === 'Backspace' && e.target.value === '' && index > 1) {
                inputs[index - 2].focus();
                inputs[index - 2].value = '';
            }
            setTimeout(checkFull, 10);
        }

        function checkFull() {
            let full = true;
            let code = "";
            inputs.forEach(inp => { 
                if(inp.value === '') full = false; 
                else code += inp.value;
            });
            
            if(full) {
                saveBtn.classList.add('active');
                if(code.length === 6) {
                    verifyAndEnable(); // Auto Submit!
                }
            } else {
                saveBtn.classList.remove('active');
            }
        }

        function copyKey() {
            navigator.clipboard.writeText(secretKey);
            const icon = document.getElementById('copyIcon');
            icon.innerText = "done_all";
            icon.classList.add('text-green-600');
            setTimeout(() => {
                icon.innerText = "content_copy";
                icon.classList.remove('text-green-600');
            }, 2000);
        }

        // Genuine Google Authenticator TOTP Algorithm
        function base32tohex(base32) {
            let base32chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            let bits = "";
            let hex = "";
            for (let i = 0; i < base32.length; i++) {
                let val = base32chars.indexOf(base32.charAt(i).toUpperCase());
                if (val === -1) return false;
                bits += val.toString(2).padStart(5, '0');
            }
            for (let i = 0; i < bits.length - 3; i += 4) {
                hex += parseInt(bits.substr(i, 4), 2).toString(16);
            }
            return hex;
        }

        function getTOTP(secret) {
            let key = base32tohex(secret);
            let epoch = Math.round(new Date().getTime() / 1000.0);
            let time = Math.floor(epoch / 30).toString(16).padStart(16, '0');
            
            let shaObj = new jsSHA("SHA-1", "HEX");
            shaObj.setHMACKey(key, "HEX");
            shaObj.update(time);
            let hmac = shaObj.getHMAC("HEX");
            
            let offset = parseInt(hmac.substring(hmac.length - 1), 16);
            let otp = (parseInt(hmac.substr(offset * 2, 8), 16) & 0x7fffffff) + "";
            return otp.padStart(6, '0').slice(-6);
        }

        function verifyAndEnable() {
            saveBtn.innerHTML = `<div class="bouncing-dots"><div></div><div></div><div></div></div>`;
            // Do NOT remove 'active' here so opacity stays 100% (bright)
            
            // Disable inputs during check
            inputs.forEach(inp => inp.disabled = true);

            setTimeout(() => {
                let userCode = "";
                inputs.forEach(inp => userCode += inp.value);
                
                let realCode = getTOTP(secretKey);
                
                if (userCode === realCode) {
                    if (is2FAEnabled) {
                        localStorage.setItem('tpr_2fa_enabled', 'false');
                        saveBtn.innerHTML = `<span class="material-symbols-outlined text-emerald-600">check_circle</span> <span class="text-emerald-700">2FA Disabled</span>`;
                    } else {
                        localStorage.setItem('tpr_2fa_enabled', 'true');
                        saveBtn.innerHTML = `<span class="material-symbols-outlined text-emerald-600">check_circle</span> <span class="text-emerald-700">2FA Enabled</span>`;
                    }
                    
                    saveBtn.style.background = 'rgba(209, 250, 229, 0.9)'; // emerald-100
                    saveBtn.style.borderColor = '#34d399';
                    
                    setTimeout(() => {
                        window.parent.loadPage('security_glass/code.html', null);
                    }, 1000);
                } else {
                    // Shake and Error State (Only affect boxes, leave button normal)
                    pinContainer.classList.add('shake-error');
                    inputs.forEach(inp => inp.classList.add('error-border'));
                    
                    // Immediately reset the button text back to normal
                    if (is2FAEnabled) {
                        saveBtn.innerHTML = `Disable 2FA <span class="material-symbols-outlined text-[20px] font-bold">security_off</span>`;
                    } else {
                        saveBtn.innerHTML = `Enable 2FA <span class="material-symbols-outlined text-[20px] font-bold">security</span>`;
                    }
                    
                    setTimeout(() => {
                        pinContainer.classList.remove('shake-error');
                        inputs.forEach(inp => {
                            inp.classList.remove('error-border');
                            inp.value = '';
                        });
                        inputs.forEach((inp, idx) => { if(idx > 0) inp.disabled = true; else inp.disabled = false; });
                        inputs[0].focus();
                        
                        saveBtn.classList.remove('active'); // Now make it dull again because it's empty
                    }, 1000);
                }
            }, 800);
        }
        
        setTimeout(() => inputs[0].focus(), 500);
    </script>
</body>
</html>
