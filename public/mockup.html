<!DOCTYPE html>
<html lang='en'>
<head>
    <link rel="stylesheet" href="/assets/tailwind-compiled.css?v=3.1.0">
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>10-in-1 Ultra Premium Device Frames V2</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; padding: 20px; }
    h1 { color: white; margin-bottom: 10px; text-align: center; font-size: 24px; }
    p { color: #94a3b8; margin-bottom: 30px; text-align: center; max-width: 600px; }
    .frame-wrapper { display: flex; flex-direction: column; align-items: center; margin: 20px; }
    .frame-title { color: #a1a1aa; margin-top: 20px; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }

    .frame-1 { position: relative; width: 330px; height: 680px; border-radius: 60px; background: linear-gradient(135deg, #a1a1aa, #3f3f46, #71717a); padding: 3px; box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.2); z-index: 10; }
    .frame-1::before { content: ''; position: absolute; inset: 2px; border-radius: 58px; background: #000; box-shadow: inset 0 0 10px rgba(255,255,255,0.1); z-index: -1; }
    
    .frame-1 .screen-area { position: absolute; top: 7px; left: 7px; right: 7px; bottom: 7px; border-radius: 53px; overflow: hidden; z-index: 5; background: #000; }
    
    .frame-1 .screen-area iframe { 
        position: absolute; 
        top: 0; 
        left: 0; 
        width: 390px; 
        height: 822.2px; 
        border: none; 
        transform: scale(0.8102); 
        transform-origin: top left; 
        display: block; 
    }

    /* Hardware Buttons */
    .frame-1 .action-btn { position: absolute; left: -2.5px; top: 130px; width: 2.5px; height: 20px; background: #a1a1aa; border-radius: 2px 0 0 2px; }
    .frame-1 .vol-up { position: absolute; left: -2.5px; top: 190px; width: 2.5px; height: 50px; background: #a1a1aa; border-radius: 2px 0 0 2px; }
    .frame-1 .vol-down { position: absolute; left: -2.5px; top: 235px; width: 2.5px; height: 50px; background: #a1a1aa; border-radius: 2px 0 0 2px; }
    .frame-1 .power-btn { position: absolute; right: -2.5px; top: 190px; width: 2.5px; height: 60px; background: #a1a1aa; border-radius: 0 2px 2px 0; }
    
    .island { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 95px; height: 28px; background: #000; border-radius: 20px; z-index: 10; box-shadow: inset 0 0 4px rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; box-sizing: border-box; }
    .island::after { content: ''; width: 12px; height: 12px; background: radial-gradient(circle at 30% 30%, #4a5482, #050505 70%); border-radius: 50%; box-shadow: inset -1px -1px 2px rgba(255,255,255,0.2); }
    .island::before { content: ''; position: absolute; left: 22px; width: 6px; height: 6px; background: radial-gradient(circle, #2a2a35, #000); border-radius: 50%; }
</style>
</head>
<body>
    <h1>Ultra Premium iPhone 17 Pro Mockup</h1>
    <p>Hyper-realistic CSS frame with live TPR app integration.</p>
    
            <div class='gallery' style='display: flex; justify-content: center; align-items: center; min-height: 80vh;'>
        <div class='frame-wrapper'>
            <div class='frame-1'><div class='action-btn'></div><div class='vol-up'></div><div class='vol-down'></div><div class='power-btn'></div><div class='island'></div>
                <div class='screen-area'><iframe src='/index.html'></iframe></div>
                
            </div>
            <div class='frame-title'>iPhone 17 Pro (Live App)</div>
        </div>
    </div>

    
</body>
</html>
