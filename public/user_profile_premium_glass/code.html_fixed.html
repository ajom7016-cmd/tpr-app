<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/assets/tailwind-compiled.css?v=3.1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TPR VIP Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL,GRAD,opsz@400,1,0,24" rel="stylesheet" />
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f1f5f9; /* Matching VIP/Home page bg */
            color: #1e293b;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 100px;
        }

        /* Animated Aura Background (Enhanced for better glass distortion) */
        .bg-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at top left, #ffe4e6 0%, #f8fafc 50%, #ffedd5 100%);
            overflow: hidden;
        }
        
        .orb-1 {
            position: absolute;
            top: -10%;
            right: -10%;
            width: 80vh;
            height: 80vh;
            background: radial-gradient(circle, rgba(255, 69, 58, 0.35) 0%, rgba(239, 68, 68, 0) 70%);
            border-radius: 50%;
            filter: blur(50px);
        }
        
        .orb-2 {
            position: absolute;
            bottom: -20%;
            left: -20%;
            width: 90vh;
            height: 90vh;
            background: radial-gradient(circle, rgba(255, 149, 0, 0.25) 0%, rgba(249, 115, 22, 0) 70%);
            border-radius: 50%;
            filter: blur(60px);
        }

        .orb-3 {
            position: absolute;
            top: 40%;
            left: 30%;
            width: 50vh;
            height: 50vh;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            filter: blur(40px);
        }

        /* Standardized Glass Card (ULTRA GLASS) -> Now True Glassmorphism */
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.05), inset 0 2px 10px rgba(255,255,255,0.3);
            border-radius: 24px;
        }

        /* 3D Glowing Button (Matches VIP Plan Subscribe Button) */
        .btn-primary {
            background: linear-gradient(135deg, #ff4d4d 0%, #ff8a3d 100%);
            box-shadow: 0 10px 20px rgba(255, 77, 77, 0.3), inset 0 2px 5px rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 16px;
            transition: transform 0.2s;
        }
        .btn-primary:active { transform: scale(0.95); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 15px rgba(0,0,0,0.03);
            border-radius: 16px;
            color: #ff4d4d;
            transition: transform 0.2s;
        }
        .btn-secondary:active { transform: scale(0.95); }

        /* Text Gradients (Red/Orange instead of Gold to match app theme) */
        .theme-text {
            background: linear-gradient(135deg, #ff4d4d 0%, #ff8a3d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* App Specific TPR Logo Box (Matches Home Page Top-Left) */
        .tpr-logo-box {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom right, rgba(255,192,203,0.3), rgba(173,216,230,0.3), rgba(152,251,152,0.3));
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.8);
            font-weight: 900;
            font-size: 13px;
            color: white;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.1);
        }

        

        
        .list-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.2) 100%);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03), inset 0 2px 10px rgba(255,255,255,0.4);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }

        .list-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.08),
                inset 0 2px 20px rgba(255, 255, 255, 1);
        }

        .list-btn:active {
            transform: scale(0.97) translateY(0);
        }

        .list-icon-gold {
            background: linear-gradient(135deg, #ff6a00, #ffc107);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-variation-settings: 'FILL' 1;
            filter: drop-shadow(0 4px 8px rgba(255,106,0,0.4));
        }
    
    /* Anti-FOUC Smooth Load */
    body {
        animation: smoothLoad 0.4s ease-out forwards;
        opacity: 0;
    }
    @keyframes smoothLoad {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }

</style>

<body class="pb-6">

        <!-- EXACT IMAGE MATCH AVATAR SECTION (ULTRA GLASS) -->
        <div class="glass-card py-6 px-4 relative z-10 flex flex-col items-center mt-0 mb-5">
            
            <!-- Avatar Area -->

                <!-- Soft background radial glow behind avatar -->

                <!-- Thin Orange/Gold Ring -->
                <div class="absolute inset-[-4px] border-[1.5px] border-orange-300 rounded-full opacity-60 z-0"></div>
                <div class="absolute inset-[-8px] border border-orange-200/50 rounded-full opacity-40 z-0"></div>
                
                <!-- Clear Avatar Frame -->
                <div class="relative w-full h-full rounded-full overflow-hidden bg-white z-10 p-[2px] shadow-sm">

                </div>

            <!-- User Info Exact Match -->
            <div class="text-center w-full mt-2 mb-1 flex flex-col items-center">

                <div class="bg-white/90 backdrop-blur-md px-4 py-1.5 rounded-full shadow-sm border border-slate-100 flex items-center justify-center">

    </div>

    

<script>
    function logout() {
        localStorage.removeItem('userToken');
        window.top.location.href = '/login.html';
    }

    // Apply Lock UI Function
    function applyLockUI(subtitleId, arrowId, lockTimeStr) {
        const subtitle = document.getElementById(subtitleId);
        const arrow = document.getElementById(arrowId);
        if(!subtitle || !arrow || !lockTimeStr) return;

        const lockTime = parseInt(lockTimeStr);
        const now = new Date().getTime();

        if (now < lockTime) {
            const timeLeft = lockTime - now;
            const days = Math.ceil(timeLeft / (1000 * 60 * 60 * 24));
            
            subtitle.innerText = `Locked for ${days} day${days>1?'s':''}`;
            subtitle.className = 'text-[11px] font-bold text-red-500 mt-0.5';
            
            arrow.innerText = 'lock';
            arrow.className = 'material-symbols-outlined text-red-500 text-[20px] relative z-10 font-bold drop-shadow-sm';
            
            // Add red bg to the button
            const btn = arrow.closest('.list-btn');
            if (btn) {
                btn.style.background = 'rgba(254, 226, 226, 0.4)'; // light red
                btn.style.borderColor = 'rgba(252, 165, 165, 0.5)';
            }
        }
    }

    // Check Locks on Load
    function checkAllLocks() {
        applyLockUI('profile-subtitle', 'profile-arrow', localStorage.getItem('temp_profile_lock'));
    }
    
    // Run after a tiny delay to ensure DOM is ready
    setTimeout(checkAllLocks, 100);
</script>


<script>
    document.addEventListener('DOMContentLoaded', () => {
        const savedPic = (() => { try { if(window.top.location.pathname.includes('landing.html')) return null; } catch(e){} return localStorage.getItem('userProfilePic'); })();
        const profAvatar = document.getElementById('prof-avatar');
        if (savedPic && profAvatar) {
            profAvatar.src = savedPic;
        }
    });

    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'UPDATE_AVATAR') {
            const profAvatar = document.getElementById('prof-avatar');
            if (profAvatar) {
                profAvatar.src = event.data.src;
            }
        }
    });
</script>
