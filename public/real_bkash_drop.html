<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/assets/tailwind-compiled.css?v=3.1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real Mobile bKash SMS Drop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #090d16;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        /* HD Realistic Mobile Wallpaper */
        .phone-wallpaper {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 10%, rgba(30, 58, 138, 0.45) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(13, 148, 136, 0.25) 0%, transparent 50%),
                linear-gradient(180deg, #0b1120 0%, #030712 100%);
            z-index: 1;
        }

        /* Abstract subtle wallpaper geometry */
        .wallpaper-shapes {
            position: absolute;
            inset: 0;
            opacity: 0.2;
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 24px 24px;
            z-index: 2;
        }

        /* Android Real Status Bar (Matching User Image 2: 4G, 11:50, Speed, WiFi, Battery) */
        .status-bar {
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 500;
            z-index: 100;
            position: relative;
            color: #f1f5f9;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        /* Clock & Date Widget */
        .widget-clock {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            z-index: 10;
            position: relative;
        }

        /* Real Android Heads-Up Push Notification (Floating Banner) */
        #bkash-notification {
            position: absolute;
            top: -160px;
            left: 10px;
            right: 10px;
            background: #ffffff;
            border-radius: 18px;
            padding: 13px 15px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 3px 10px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            transition: transform 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.25);
            transform: translateY(0);
        }

        /* bKash Icon Container */
        .bkash-logo-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(226, 19, 110, 0.2);
            padding: 4px;
        }

        .bkash-logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Notification text details */
        .notif-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .notif-title {
            font-size: 14.5px;
            font-weight: 700;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .notif-time {
            font-size: 11px;
            font-weight: 500;
            color: #6b7280;
        }

        .notif-body {
            font-size: 13.5px;
            color: #1f2937;
            line-height: 1.4;
            font-weight: 400;
            margin-bottom: 3px;
        }

        .notif-sub {
            font-size: 11.5px;
            color: #4b5563;
            line-height: 1.4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            word-break: break-all;
        }

        /* App Dock at Bottom */
        .dock-container {
            position: absolute;
            bottom: 24px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .dock-app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .dock-icon {
            width: 54px;
            height: 54px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
        }

        .dock-label {
            font-size: 11px;
            color: #cbd5e1;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="phone-wallpaper"></div>
    <div class="wallpaper-shapes"></div>

    <!-- Android Real Status Bar (Exact like user phone image) -->
    <div class="status-bar">
        <div class="status-left">
            <span class="text-[11px] font-bold tracking-tight">4G</span>
            <span class="font-bold text-[13.5px] ml-1">11:50</span>
            <span class="material-symbols-outlined text-[14px] text-green-400 ml-1">chat</span>
        </div>
        <div class="status-right">
            <span class="text-[10px] text-slate-300 font-mono">1.20 KB/s</span>
            <span class="material-symbols-outlined text-[15px]">signal_cellular_4_bar</span>
            <span class="material-symbols-outlined text-[15px]">wifi</span>
            <span class="text-[11px] font-bold">85%</span>
            <span class="material-symbols-outlined text-[16px]">battery_5_bar</span>
        </div>
    </div>

    <!-- Mobile Screen Center Widget -->
    <div class="widget-clock">
        <span class="text-slate-400 text-[13px] font-medium tracking-wide">Tuesday, 29 September</span>
        <span class="text-[76px] font-light text-white tracking-tighter leading-none mt-1">11:50</span>
    </div>

    <!-- 100% REAL BKASH HEADS-UP PUSH NOTIFICATION -->
    <div id="bkash-notification">
        <div class="bkash-logo-box">
            <img src="/assets/bkash.png" alt="bKash" />
        </div>
        <div style="flex: 1; min-width: 0;">
            <div class="notif-header">
                <div class="notif-title">
                    <span>bKash</span>
                </div>
                <span class="notif-time">now</span>
            </div>
            <div class="notif-body">
                You have received <b>Tk 520.00</b> from <b>TPR App</b>.
            </div>
            <div class="notif-sub">
                Fee Tk 0.00. Balance Tk 1,520.00. TrxID DIH8M2K91X at 29/09/2026 23:50
            </div>
        </div>
    </div>

    <!-- Android Home Screen Apps Dock -->
    <div class="dock-container">
        <div class="dock-app">
            <div class="dock-icon bg-gradient-to-tr from-blue-600 to-blue-400 text-white">
                <span class="material-symbols-outlined text-[26px]">call</span>
            </div>
            <span class="dock-label">Phone</span>
        </div>
        <div class="dock-app">
            <div class="dock-icon bg-gradient-to-tr from-emerald-600 to-teal-500 text-white">
                <span class="material-symbols-outlined text-[26px]">sms</span>
            </div>
            <span class="dock-label">Messages</span>
        </div>
        <div class="dock-app">
            <div class="dock-icon bg-white p-2">
                <img src="/assets/bkash.png" class="w-full h-full object-contain" />
            </div>
            <span class="dock-label">bKash</span>
        </div>
        <div class="dock-app">
            <div class="dock-icon bg-gradient-to-tr from-rose-600 to-red-500 text-white">
                <span class="material-symbols-outlined text-[26px]">smart_display</span>
            </div>
            <span class="dock-label">YouTube</span>
        </div>
    </div>

    <script>
        // Trigger notification slide down with smooth 60fps spring physics
        function dropNotification() {
            const notif = document.getElementById('bkash-notification');
            const duration = 650;
            const startY = 0;
            const targetY = 210;
            const t0 = performance.now();

            function frame(now) {
                const elapsed = now - t0;
                const p = Math.min(1, elapsed / duration);
                // Elastic cubic-out with slight overshoot
                const ease = Math.sin(-13 * (p + 1) * Math.PI / 2) * Math.pow(2, -10 * p) + 1;
                const currentY = startY + (targetY - startY) * ease;
                notif.style.transform = 'translateY(' + currentY.toFixed(2) + 'px)';
                if (p < 1) {
                    requestAnimationFrame(frame);
                } else {
                    notif.style.transform = 'translateY(' + targetY + 'px)';
                }
            }
            requestAnimationFrame(frame);
        }
        window.dropNotification = dropNotification;
    </script>
</body>
</html>
