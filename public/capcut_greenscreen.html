<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CapCut Green Screen bKash Overlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #00FF00; /* Pure Chroma Green for CapCut */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        /* 1080p Full HD Scale Notification Card */
        #bkash-notification {
            position: absolute;
            top: -240px;
            left: 5%;
            width: 90%;
            background: #ffffff;
            border-radius: 36px;
            padding: 28px 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), 0 5px 15px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(0, 0, 0, 0.06);
            z-index: 9999;
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        /* bKash Icon Container */
        .bkash-logo-box {
            width: 88px;
            height: 88px;
            border-radius: 24px;
            background: #ffffff;
            border: 2px solid rgba(226, 19, 110, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 6px 18px rgba(226, 19, 110, 0.2);
            padding: 8px;
        }

        .bkash-logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .notif-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .notif-title {
            font-size: 32px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.5px;
        }

        .notif-time {
            font-size: 22px;
            font-weight: 500;
            color: #6b7280;
        }

        .notif-body {
            font-size: 30px;
            color: #1f2937;
            line-height: 1.35;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .notif-sub {
            font-size: 23px;
            color: #4b5563;
            line-height: 1.4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <!-- REAL BKASH OVERLAY CARD -->
    <div id="bkash-notification">
        <div class="bkash-logo-box">
            <img src="/assets/bkash.png" alt="bKash" />
        </div>
        <div style="flex: 1; min-width: 0;">
            <div class="notif-header">
                <div class="notif-title">
                    bKash
                </div>
                <span class="notif-time">now</span>
            </div>
            <div class="notif-body">
                You have received <b>Tk 520.00</b> from <b>TPR App</b>.
            </div>
            <div class="notif-sub">
                Fee Tk 0.00. Balance Tk 1,520.00. TrxID DIH8M2K91X at 29/09/2026 23:50
            </div>
        </div>
    </div>

    <script>
        // Smooth 60fps spring drop animation
        function dropNotification() {
            const notif = document.getElementById('bkash-notification');
            const duration = 650;
            const startY = -240;
            const targetY = 80;
            const t0 = performance.now();

            function frame(now) {
                const elapsed = now - t0;
                const p = Math.min(1, elapsed / duration);
                // Elastic cubic-out with natural overshoot
                const ease = Math.sin(-13 * (p + 1) * Math.PI / 2) * Math.pow(2, -10 * p) + 1;
                const currentY = startY + (targetY - startY) * ease;
                notif.style.transform = 'translateY(' + (currentY - startY).toFixed(2) + 'px)';
                if (p < 1) {
                    requestAnimationFrame(frame);
                } else {
                    notif.style.transform = 'translateY(' + (targetY - startY) + 'px)';
                }
            }
            requestAnimationFrame(frame);
        }
        window.dropNotification = dropNotification;
    </script>
</body>
</html>
