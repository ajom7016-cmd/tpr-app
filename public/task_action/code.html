<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Task Action</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>
        body { font-family: 'Nunito', sans-serif; background: transparent; }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #ea580c;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            border-radius: 24px;
        }
    
    

</style>





























<style id="custom-global-scrollbar">
  /* Smooth, native-feeling scrollbar */
  ::-webkit-scrollbar { width: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.25); border-radius: 7px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.4); }

  /* Perfectly aligned scrollbar buttons (Gray Triangles) */
  ::-webkit-scrollbar-button:single-button {
    background-color: transparent;
    display: block;
    height: 14px;
    width: 7px;
    background-repeat: no-repeat;
    background-position: center;
    background-size: 7px 7px;
  }
  
  /* Top Gray Triangle */
  ::-webkit-scrollbar-button:single-button:vertical:decrement {
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyMCAyMCc+PHBvbHlnb24gcG9pbnRzPScxLDE3IDE5LDE3IDEwLDUnIGZpbGw9JyM2NDZlNzgnLz48L3N2Zz4=");
  }
  
  /* Bottom Gray Triangle */
  ::-webkit-scrollbar-button:single-button:vertical:increment {
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyMCAyMCc+PHBvbHlnb24gcG9pbnRzPScxLDMgMTksMyAxMCwxNScgZmlsbD0nIzY0NmU3OCcvPjwvc3ZnPg==");
  }
</style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center">

    <div class="w-full max-w-sm glass-panel p-8 text-center flex flex-col items-center">
        <div id="loading-state">
            <div class="spinner mx-auto mb-6 shadow-lg rounded-full"></div>
            <h2 class="text-xl font-black text-slate-800 mb-2">Processing Task...</h2>
            <p class="text-sm font-bold text-slate-500">Please wait while we verify your completion.</p>
        </div>
        
        <div id="success-state" class="hidden">
            <div class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_10px_20px_rgba(34,197,94,0.3)]">
                <span class="material-symbols-outlined text-white text-4xl">check</span>
            </div>
            <h2 class="text-xl font-black text-slate-800 mb-2">Task Completed!</h2>
            <p class="text-sm font-bold text-slate-500 mb-4">Reward has been added to your balance.</p>
            <p class="text-xs font-bold text-orange-600 animate-pulse">Redirecting to Home...</p>
        </div>
        
        <div id="error-state" class="hidden">
            <div class="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_10px_20px_rgba(239,68,68,0.3)]">
                <span class="material-symbols-outlined text-white text-4xl">close</span>
            </div>
            <h2 class="text-xl font-black text-slate-800 mb-2">Verification Failed</h2>
            <p id="error-message" class="text-sm font-bold text-slate-500 mb-6">Something went wrong.</p>
            <button onclick="goBack()" class="px-6 py-2.5 bg-slate-800 text-white rounded-xl font-bold text-sm">Go Back</button>
        </div>
    </div>

    <script src="/js/app.js?v=2.5.0"></script>
    <script>
        function goBack() {
            if(window.parent && window.parent.loadPage) {
                window.parent.loadPage('glassmorphic_2/code.html');
            } else {
                window.history.back();
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const taskId = urlParams.get('taskId');
            
            if (!taskId) {
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('error-state').classList.remove('hidden');
                document.getElementById('error-message').innerText = "Invalid Task ID.";
                return;
            }

            setTimeout(async () => {
                try {
                    const token = (() => { try { return (() => { try { return window.parent.localStorage.getItem('userToken'); } catch(e) { return localStorage.getItem('userToken'); } })(); } catch(e) { return localStorage.getItem('userToken'); } })();
                    const response = await fetch('/api/tasks/complete', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}` 
                        },
                        body: JSON.stringify({ taskId })
                    });
                    const res = await response.json();
                    
                    document.getElementById('loading-state').classList.add('hidden');
                    
                    if (res && res.reward) {
                        document.getElementById('success-state').classList.remove('hidden');
                        setTimeout(() => {
                            if(window.parent && window.parent.loadPage) {
                                window.parent.loadPage('glassmorphic_1/code.html');
                            }
                        }, 1500);
                    } else {
                        document.getElementById('error-state').classList.remove('hidden');
                        document.getElementById('error-message').innerText = res.error || "Failed to verify task.";
                    }
                } catch(e) {
                    document.getElementById('loading-state').classList.add('hidden');
                    document.getElementById('error-state').classList.remove('hidden');
                    document.getElementById('error-message').innerText = "Network error.";
                }
            }, 1500);
        });
    </script>
</body>
</html>
