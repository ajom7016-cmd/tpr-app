<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/assets/tailwind-compiled.css?v=3.1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Active Devices</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL,GRAD,opsz@400,1,0,24" rel="stylesheet" />

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            background-color: transparent;
        }

        .header-btn {
            width: 48px; height: 48px; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.6); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 8px 20px rgba(0,0,0,0.04); transition: transform 0.2s;
        }
        .header-btn:active { transform: scale(0.9); }

        .map-hero {
            position: relative; width: 100%; height: 220px; border-radius: 24px;
            overflow: hidden;
            background: rgba(226, 232, 240, 0.5);
            border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 24px; z-index: 10;
        }

        .map-hero iframe {
            width: 100%; height: 100%; border: 0;
            filter: contrast(1.1) saturate(1.2); /* Slight enhancement to make Google Map pop */
        }

        .device-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.2) 100%);
            backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 25px rgba(0,0,0,0.04), inset 0 2px 10px rgba(255,255,255,0.4);
            border-radius: 20px; padding: 20px; margin-bottom: 16px;
            transition: all 0.3s ease; overflow: hidden;
        }
    
    


    /* === ULTRA-FAST 0.15s NO-LAG GPU NATIVE ENTRANCE === */
    @keyframes fastNativeEntrance {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    body {
        animation: fastNativeEntrance 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
        will-change: opacity, transform;
    }
    </style>





























<style id="custom-global-scrollbar">
  /* Smooth, native-feeling scrollbar */
  ::-webkit-scrollbar { width: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.25); border-radius: 7px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.4); }

  /* Perfectly aligned scrollbar buttons (Gray Triangles) */
  ::-webkit-scrollbar-button:single-button {
    background-color: transparent;
    display: block;
    height: 14px;
    width: 7px;
    background-repeat: no-repeat;
    background-position: center;
    background-size: 7px 7px;
  }
  
  /* Top Gray Triangle */
  ::-webkit-scrollbar-button:single-button:vertical:decrement {
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyMCAyMCc+PHBvbHlnb24gcG9pbnRzPScxLDE3IDE5LDE3IDEwLDUnIGZpbGw9JyM2NDZlNzgnLz48L3N2Zz4=");
  }
  
  /* Bottom Gray Triangle */
  ::-webkit-scrollbar-button:single-button:vertical:increment {
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyMCAyMCc+PHBvbHlnb24gcG9pbnRzPScxLDMgMTksMyAxMCwxNScgZmlsbD0nIzY0NmU3OCcvPjwvc3ZnPg==");
  }
</style>
</head>
<body class="pb-28 pt-2 relative overflow-x-hidden text-slate-800" style="overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch;" style="background: transparent !important; background-color: transparent !important;">

    <!-- Back Button (Static) -->
    <div class="mb-4 mt-2 ml-2 flex-none relative z-50">
        <button class="text-slate-500 hover:text-slate-900 bg-white/70 hover:bg-white/95 backdrop-blur-xl rounded-full shadow-[0_4px_15px_rgba(0,0,0,0.08)] border border-white/80 flex items-center p-2 transition-all duration-300 hover:scale-110 active:scale-95" onclick="window.parent.loadPage('security_glass/code.html', null)">
            <span class="material-symbols-outlined text-[20px] ml-[-2px]">arrow_back_ios_new</span>
        </button>
    </div>
    

    

    <div class="max-w-[400px] mx-auto px-6 relative z-10">
        
        <!-- Genuine Google Map Container -->
        <div class="max-w-[400px] mx-auto px-6 relative z-10 space-y-6 pt-6">
        <h1 class="text-[20px] font-black text-slate-800 tracking-tight text-center truncate mb-6">Active Devices</h1>
<div class="map-hero" id="map-container">
            <div class="w-full h-full flex flex-col items-center justify-center bg-slate-100">
                <span class="material-symbols-outlined text-[32px] text-slate-400 animate-pulse mb-2">satellite_alt</span>
                <p class="text-[12px] font-bold text-slate-500 uppercase tracking-widest">Connecting to Google Maps...</p>
            </div>
        </div>

        <div id="devices-list">
            <div class="text-center text-slate-400 mt-4 text-[12px] font-bold">Loading devices...</div>
        </div>

    </div>

    <script>
        function loadGoogleMap(lat, lon) {
            const mapContainer = document.getElementById('map-container');
            mapContainer.innerHTML = `
                <iframe 
                    referrerpolicy="no-referrer-when-downgrade" 
                    src="https://maps.google.com/maps?q=${lat},${lon}&z=16&output=embed" 
                    allowfullscreen>
                </iframe>
            `;
        }
        loadGoogleMap(23.6850, 90.3563); // Default to Bangladesh

        async function initDevices() {
            try {
                const token = (() => { try { return window.parent.localStorage.getItem('userToken'); } catch(e) { return localStorage.getItem('userToken'); } })();
                if(!token) return;
                
                const res = await fetch('/api/devices', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                let devices = [];
                if(res.ok) {
                    devices = await res.json();
                }

                const list = document.getElementById('devices-list');
                list.innerHTML = '';
                
                let currentHtml = '';
                let otherHtml = '';
                
                devices.forEach(d => {
                    const isCurrent = d.is_current;
                    let iconName = "smartphone";
                    if(d.device_name && (d.device_name.includes("Windows") || d.device_name.includes("Mac"))) iconName = "computer";
                    
                    const html = `
                    <div class="device-card" style="${!isCurrent ? 'opacity: 0.8; transform: scale(0.98);' : ''}">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center flex-shrink-0 text-slate-500 shadow-inner">
                                <span class="material-symbols-outlined text-[24px]">${iconName}</span>
                            </div>
                            <div class="flex-1">
                                <h3 class="text-[16px] font-bold text-slate-800 truncate flex items-center gap-1.5">
                                    ${d.device_name || 'Unknown Device'}
                                    ${isCurrent ? '<span class="material-symbols-outlined text-[14px] text-emerald-500 animate-pulse">sensors</span>' : ''}
                                </h3>
                                <p class="text-[11px] font-semibold ${isCurrent ? 'text-emerald-600' : 'text-slate-400'} mt-0.5" id="desc-${d.id}">
                                    ${isCurrent ? 'Active Now' : 'Last Active: ' + new Date(d.last_active).toLocaleString()} • IP: ${d.ip_address}
                                </p>
                            </div>
                        </div>
                    </div>`;
                    
                    if (isCurrent) currentHtml = `<p class="text-[12px] font-black text-slate-400 uppercase tracking-widest pl-2 mb-3">Current Session</p>` + html;
                    else otherHtml += html;
                });
                
                if(otherHtml) otherHtml = `<p class="text-[12px] font-black text-slate-400 uppercase tracking-widest pl-2 mb-3 mt-4">Other Sessions</p>` + otherHtml;
                
                list.innerHTML = currentHtml + otherHtml;
                
                // Update parent badge
                try {
                    const badge = window.parent.document.getElementById('devices-badge');
                    if(badge) badge.innerText = devices.length + (devices.length === 1 ? ' Device' : ' Devices');
                } catch(e) {}
                
                // Genuine High-Accuracy Native GPS Location for current device
                const fallbackToIPLocation = () => {
                    const updateUI = (lat, lon, area) => {
                        if(lat && lon) loadGoogleMap(lat, lon);
                        const currentDesc = devices.find(d => d.is_current);
                        if(currentDesc) {
                            const p = document.getElementById(`desc-${currentDesc.id}`);
                            if(p) p.innerHTML = `Active Now • IP: ${currentDesc.ip_address} • Loc: ${area || "Unknown Area"}`;
                        }
                    };

                    // Try ipapi.co first (Very detailed district level)
                    fetch('https://ipapi.co/json/')
                        .then(r => r.json())
                        .then(data => {
                            if(data.error || !data.city) throw new Error("Rate limited or no city");
                            updateUI(data.latitude, data.longitude, data.city);
                        })
                        .catch(() => {
                            // Try ipinfo.io
                            fetch('https://ipinfo.io/json')
                            .then(r => r.json())
                            .then(data => {
                                if(!data.city) throw new Error("No city");
                                const loc = data.loc ? data.loc.split(',') : null;
                                updateUI(loc ? loc[0] : null, loc ? loc[1] : null, data.city);
                            })
                            .catch(() => {
                                // Fallback to geojs
                                fetch('https://get.geojs.io/v1/ip/geo.json')
                                .then(r => r.json())
                                .then(data => {
                                    updateUI(data.latitude, data.longitude, data.city || data.region || data.country);
                                }).catch(()=>{});
                            });
                        });
                };

                // Check if running on secure context (HTTPS or localhost)
                if ("geolocation" in navigator && window.isSecureContext) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            loadGoogleMap(lat, lon);
                            
                            // Get city name using Reverse Geocoding API
                            fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`)
                                .then(res => res.json())
                                .then(data => {
                                    const exactArea = data.locality || data.city || data.principalSubdivision || "Unknown Area";
                                    const currentDesc = devices.find(d => d.is_current);
                                    if(currentDesc) {
                                        const p = document.getElementById(`desc-${currentDesc.id}`);
                                        if(p) p.innerHTML = `Active Now • IP: ${currentDesc.ip_address} • Loc: ${exactArea}`;
                                    }
                                }).catch(()=>{});
                        },
                        (error) => { fallbackToIPLocation(); },
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                } else {
                    fallbackToIPLocation();
                }

            } catch(e) {
                console.error(e);
            }
        }
        
        initDevices();
    </script>
</body>
</html>
