<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Button Variations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet" />
    <style>
        body { font-family: 'Outfit', sans-serif; background: #e2e8f0; }
        .glass-btn {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
    
    /* Anti-FOUC Smooth Load */
    body {
        animation: smoothLoad 0.4s ease-out forwards;
        opacity: 0;
    }
    @keyframes smoothLoad {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }

</style>
</head>
<body class="p-8 flex flex-col items-center gap-12">
    <h1 class="text-2xl font-black text-slate-800 mb-4">Pick Your Favorite Design</h1>

    <!-- Design 1: The Glass Orb -->
    <div class="w-full max-w-md bg-slate-200 p-8 rounded-[32px] relative h-[150px] flex justify-center">
        <h2 class="absolute top-4 left-6 font-bold text-slate-500">1. The Glass Orb</h2>
        <div class="absolute bottom-6 w-14 h-14 rounded-full glass-btn flex items-center justify-center cursor-pointer border-b-2 border-b-orange-400">
            <span class="material-symbols-outlined text-slate-800 text-[28px]">keyboard_arrow_up</span>
        </div>
    </div>

    <!-- Design 2: The Premium Pill -->
    <div class="w-full max-w-md bg-slate-200 p-8 rounded-[32px] relative h-[150px] flex justify-center">
        <h2 class="absolute top-4 left-6 font-bold text-slate-500">2. The Premium Pill</h2>
        <div class="absolute bottom-6 px-6 py-2.5 rounded-full glass-btn flex items-center justify-center cursor-pointer gap-2">
            <span class="font-bold text-[13px] text-slate-700 tracking-wider">MENU</span>
            <span class="material-symbols-outlined text-slate-700 text-[18px]">expand_less</span>
        </div>
    </div>

    <!-- Design 3: Perfect SVG Chevrons -->
    <div class="w-full max-w-md bg-slate-200 p-8 rounded-[32px] relative h-[150px] flex justify-center">
        <h2 class="absolute top-4 left-6 font-bold text-slate-500">3. Perfect Chevrons</h2>
        <div class="absolute bottom-6 flex flex-col items-center justify-center cursor-pointer pb-2">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: -18px; opacity: 0.4;"><polyline points="18 15 12 9 6 15"></polyline></svg>
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: -18px; opacity: 0.7;"><polyline points="18 15 12 9 6 15"></polyline></svg>
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </div>
    </div>

    <!-- Design 4: Minimal Dash (iOS Style) -->
    <div class="w-full max-w-md bg-slate-200 p-8 rounded-[32px] relative h-[150px] flex justify-center">
        <h2 class="absolute top-4 left-6 font-bold text-slate-500">4. iOS Swipe Dash</h2>
        <div class="absolute bottom-6 w-32 h-1.5 bg-slate-400 rounded-full cursor-pointer hover:bg-slate-600 transition-colors"></div>
    </div>

    <!-- Design 5: The Floating Tab -->
    <div class="w-full max-w-md bg-slate-200 p-8 rounded-[32px] relative h-[150px] flex justify-center">
        <h2 class="absolute top-4 left-6 font-bold text-slate-500">5. The Floating Tab</h2>
        <div class="absolute bottom-0 w-24 h-10 bg-white/80 backdrop-blur-md rounded-t-[20px] shadow-[0_-4px_20px_rgba(0,0,0,0.05)] border-t border-x border-white flex items-center justify-center cursor-pointer">
            <div class="w-10 h-1 bg-slate-300 rounded-full"></div>
        </div>
    </div>

</body>
</html>
