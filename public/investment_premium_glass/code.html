<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/assets/tailwind-compiled.css?v=3.1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - Ultimate Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Premium transitions */
        .page-transition { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease; }
        .slide-out-left { transform: translateX(-100%); opacity: 0; pointer-events: none; position: absolute; top: 0; left: 0; width: 100%; }
        .slide-in-right { transform: translateX(0); opacity: 1; pointer-events: auto; position: relative; }
        .slide-out-right { transform: translateX(100%); opacity: 0; pointer-events: none; position: absolute; top: 0; left: 0; width: 100%; }
        
        .method-card.active { border-color: #f97316; background-color: #fffaf5; box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.2); transform: translateY(-4px); }
        .method-card { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); border: 2px solid transparent; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2) !important;
        }
        .method-card.active .check-circle { border-color: #ea580c !important; }
        .method-card.active .check-circle div { opacity: 1 !important; }
    
    /* Anti-FOUC Smooth Load */
    body {
        animation: smoothLoad 0.4s ease-out forwards;
        opacity: 0;
    }
    @keyframes smoothLoad {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }

</style>





























<style id="custom-global-scrollbar">
  /* Smooth, native-feeling scrollbar */
  ::-webkit-scrollbar { width: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.25); border-radius: 7px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.4); }

  /* Perfectly aligned scrollbar buttons (Gray Triangles) */
  ::-webkit-scrollbar-button:single-button {
    background-color: transparent;
    display: block;
    height: 14px;
    width: 7px;
    background-repeat: no-repeat;
    background-position: center;
    background-size: 7px 7px;
  }
  
  /* Top Gray Triangle */
  ::-webkit-scrollbar-button:single-button:vertical:decrement {
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyMCAyMCc+PHBvbHlnb24gcG9pbnRzPScxLDE3IDE5LDE3IDEwLDUnIGZpbGw9JyM2NDZlNzgnLz48L3N2Zz4=");
  }
  
  /* Bottom Gray Triangle */
  ::-webkit-scrollbar-button:single-button:vertical:increment {
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyMCAyMCc+PHBvbHlnb24gcG9pbnRzPScxLDMgMTksMyAxMCwxNScgZmlsbD0nIzY0NmU3OCcvPjwvc3ZnPg==");
  }
</style>
</head>
<body class="pb-10">
    
    <!-- Header -->
    <div class="bg-white/80 backdrop-blur-xl px-5 py-3 pt-5 sticky top-0 z-50 flex justify-between items-center border-b border-slate-100">
        <span onclick="goBack()" class="material-symbols-outlined text-slate-800 text-[24px] cursor-pointer hover:bg-slate-100 rounded-full p-1.5 transition-colors">arrow_back_ios_new</span>
        <h2 class="text-[19px] font-black text-slate-800 tracking-wide" id="page-title">Add Balance</h2>
        <span onclick="window.parent.loadPage('glassmorphic_3/code.html', null)" class="material-symbols-outlined text-orange-500 text-[26px] cursor-pointer hover:bg-orange-50 rounded-full p-1.5 transition-colors">history</span>
    </div>

    <div class="relative w-full h-full overflow-hidden px-5 py-4">
        
        <!-- ================= VIEW 1: Method & Amount ================= -->
        <div id="view-1" class="page-transition slide-in-right w-full">
            
            <p class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Select Gateway</p>
            
            <!-- Massive Logos -->
            <div class="flex flex-col gap-3 mb-6">
                <!-- bKash -->
                <div onclick="selectMethod('bKash')" id="method-bKash" class="method-card active bg-white rounded-[20px] p-3 shadow-sm cursor-pointer flex items-center justify-between border-slate-200">
                    <img src="https://download.logo.wine/logo/BKash/BKash-Logo.wine.png" class="h-10 scale-150 object-contain origin-left ml-2" alt="bKash">
                    <div class="w-4 h-4 rounded-full border-2 border-slate-200 flex items-center justify-center bg-white check-circle"><div class="w-2 h-2 bg-orange-500 rounded-full opacity-0 transition-opacity"></div></div>
                </div>
                <!-- Nagad -->
                <div onclick="selectMethod('Nagad')" id="method-Nagad" class="method-card bg-white rounded-[20px] p-3 shadow-sm cursor-pointer flex items-center justify-between border-slate-200">
                    <img src="https://download.logo.wine/logo/Nagad/Nagad-Logo.wine.png" class="h-10 scale-150 object-contain origin-left ml-2" alt="Nagad">
                    <div class="w-4 h-4 rounded-full border-2 border-slate-200 flex items-center justify-center bg-white check-circle"><div class="w-2 h-2 bg-orange-500 rounded-full opacity-0 transition-opacity"></div></div>
                </div>
                <!-- Binance -->
                <div onclick="selectMethod('Binance')" id="method-Binance" class="method-card bg-white rounded-[20px] p-3 shadow-sm cursor-pointer flex items-center justify-between border-slate-200">
                    <img src="https://download.logo.wine/logo/Binance/Binance-Logo.wine.png" class="h-10 scale-[1.7] object-contain origin-left ml-3" alt="Binance">
                    <div class="w-4 h-4 rounded-full border-2 border-slate-200 flex items-center justify-center bg-white check-circle"><div class="w-2 h-2 bg-orange-500 rounded-full opacity-0 transition-opacity"></div></div>
                </div>
            </div>

            <div class="flex items-center justify-between mb-2">
                <p class="text-xs font-black text-slate-400 uppercase tracking-widest">Enter Amount</p>
                <p id="amount-error" class="text-red-500 text-[11px] font-bold hidden"></p>
            </div>
            <div id="amount-box" class="bg-white rounded-[16px] px-4 py-2.5 shadow-sm border border-slate-100 mb-6 focus-within:border-orange-500 focus-within:shadow-[0_8px_20px_-5px_rgba(249,115,22,0.15)] transition-all">
                <div class="flex items-end justify-center gap-1.5 mb-1">
                    <span class="text-xl font-medium text-slate-400 mb-0.5" id="currency-symbol">৳</span>
                    <input type="number" id="amount-input" placeholder="0" class="w-full text-center text-3xl font-semibold text-slate-700 bg-transparent outline-none placeholder:text-slate-200">
                </div>
                
                <!-- Max System -->
                <div class="text-center mt-3 pt-3 border-t border-slate-100 flex items-center justify-center gap-2">
                    <span class="text-[13px] font-bold text-slate-400" id="balance-text">Available Balance: ৳1240</span>
                    <span class="text-[13px] font-black text-orange-500 bg-orange-50 px-2 py-0.5 rounded cursor-pointer hover:bg-orange-100 transition-colors" onclick="setMaxAmount()">MAX</span>
                </div>
            </div>

            <button onclick="goToNextStep()" class="w-full bg-gradient-to-r from-orange-500 to-orange-400 text-white font-bold text-[16px] py-4 rounded-[16px] shadow-lg hover:shadow-[0_15px_30px_rgba(249,115,22,0.3)] transition-all flex items-center justify-center gap-2 active:scale-95">
                Continue <span class="material-symbols-outlined text-[20px]">arrow_right_alt</span>
            </button>
        </div>

        <!-- ================= VIEW 2: Verification ================= -->
        <div id="view-2" class="page-transition slide-out-right w-full">
            
            <div class="bg-gradient-to-br from-orange-500 to-orange-600 rounded-[20px] p-5 text-white shadow-[0_10px_25px_rgba(249,115,22,0.3)] mb-6 relative overflow-hidden border border-orange-400/50">
                <div class="absolute -right-4 -bottom-4 opacity-10 transform -rotate-12"><span class="material-symbols-outlined text-[100px]">account_balance_wallet</span></div>
                <p class="text-[13px] font-bold text-orange-100 mb-1.5">Paying via <span id="summary-method" class="font-black text-white">bKash</span></p>
                <div class="flex items-center gap-2.5 relative z-10">
                    <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center p-1.5 shadow-md">
                        <img id="summary-logo" src="https://download.logo.wine/logo/BKash/BKash-Logo.wine.png" class="w-full h-full object-contain">
                    </div>
                    <h1 class="text-3xl font-extrabold tracking-tight" id="summary-amt">৳ 0</h1>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1.5" id="instruction-text">Send to this number</p>
                    <div class="bg-white rounded-[16px] p-1.5 flex justify-between items-center shadow-sm border border-slate-100">
                        <input type="text" readonly id="payment-address" value="01*******06" class="bg-transparent w-full px-3 text-lg font-black text-slate-800 outline-none font-mono tracking-widest">
                        <div onclick="copyAddress()" class="min-w-[48px] h-12 bg-orange-50 rounded-[12px] flex items-center justify-center cursor-pointer hover:bg-orange-100 hover:text-orange-600 transition-colors text-orange-500 border border-orange-100/50">
                            <span class="material-symbols-outlined text-[20px]">content_copy</span>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <p class="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Transaction ID</p>
                        <p id="trx-error" class="text-red-500 text-[10px] font-bold hidden"></p>
                    </div>
                    <div id="trx-box" class="bg-slate-50 rounded-[16px] p-1.5 flex items-center shadow-inner border border-slate-200 focus-within:bg-white focus-within:border-orange-500 focus-within:shadow-md transition-all">
                        <span class="material-symbols-outlined text-slate-400 ml-3 text-[20px]">tag</span>
                        <input type="text" id="trx-id" placeholder="e.g. 9XKD82MD" class="bg-transparent w-full p-3 text-base font-bold text-slate-800 outline-none uppercase placeholder:normal-case placeholder:font-medium placeholder:text-slate-400">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <p class="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Screenshot</p>
                        <p id="upload-error" class="text-red-500 text-[10px] font-bold hidden"></p>
                    </div>
                    <input type="file" id="file-upload" class="hidden" accept="image/*" onchange="handleFileUpload(event)">
                    <div onclick="document.getElementById('file-upload').click()" id="upload-box" class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-[20px] p-4 text-center cursor-pointer hover:border-orange-400 hover:bg-orange-50 transition-all relative overflow-hidden h-28 flex flex-col items-center justify-center">
                        <img id="upload-preview" src="" class="absolute inset-0 w-full h-full object-cover hidden opacity-90" alt="Preview">
                        
                        <!-- Cancel Button -->
                        <div id="cancel-upload-btn" onclick="cancelUpload(event)" class="hidden absolute top-3 right-3 w-8 h-8 bg-slate-900/50 backdrop-blur-md rounded-full text-white flex items-center justify-center shadow-lg hover:bg-red-500 transition-colors z-20">
                            <span class="material-symbols-outlined text-[18px]">close</span>
                        </div>

                        <div id="upload-content" class="relative z-10 flex flex-col items-center">
                            <div class="w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-2 shadow-sm border border-slate-100" id="upload-icon-container">
                                <span class="material-symbols-outlined text-[28px] text-slate-400" id="upload-icon">cloud_upload</span>
                            </div>
                            <h3 class="text-[16px] font-black text-slate-700" id="upload-title">Tap to Upload Proof</h3>
                            <p class="text-[12px] font-medium text-slate-400 mt-1" id="upload-subtitle">Required to verify payment</p>
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="submitDeposit()" class="w-full mt-6 bg-gradient-to-r from-orange-500 to-orange-400 text-white font-bold text-[16px] py-4 rounded-[16px] shadow-[0_10px_25px_rgba(249,115,22,0.3)] hover:shadow-[0_15px_30px_rgba(249,115,22,0.4)] transition-all flex items-center justify-center gap-2 active:scale-95">
                Confirm Deposit <span class="material-symbols-outlined text-[20px]">check_circle</span>
            </button>
        </div>
    </div>

    <script>
        let currentMethod = 'bKash';
        let currentStep = 1;
        const availableBalance = {
            'bKash': 1240,
            'Nagad': 1240,
            'Binance': 50
        };

        const paymentDetails = {
            'bKash': { instruction: 'Send money to this bKash Personal number:', address: '01870161107', symbol: '৳', logo: 'https://download.logo.wine/logo/BKash/BKash-Logo.wine.png' },
            'Nagad': { instruction: 'Send money to this Nagad Personal number:', address: '01870161107', symbol: '৳', logo: 'https://download.logo.wine/logo/Nagad/Nagad-Logo.wine.png' },
            'Binance': { instruction: 'Send USDT (TRC20) to this Crypto Wallet Address:', address: 'TXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX', symbol: '$', logo: 'https://download.logo.wine/logo/Binance/Binance-Logo.wine.png' }
        };

        async function loadPaymentSettings() {
            try {
                const res = await fetch('/api/settings');
                if (res.ok) {
                    const data = await res.json();
                    if (data.bkash_number) paymentDetails['bKash'].address = data.bkash_number;
                    if (data.nagad_number) paymentDetails['Nagad'].address = data.nagad_number;
                }
            } catch(e) {}
        }
        loadPaymentSettings();

        function selectMethod(method) {
            currentMethod = method;
            
            // Reset UI
            document.querySelectorAll('.method-card').forEach(card => {
                card.classList.remove('active', 'border-orange-500');
                card.classList.add('border-slate-200');
                
                // Handled by CSS now
                icon.classList.add('text-transparent');
            });
            
            // Set Active UI
            const selectedCard = document.getElementById('method-' + method);
            selectedCard.classList.add('active');
            selectedCard.classList.remove('border-slate-200');
            
            // Handled by CSS now
            selectedIcon.classList.remove('text-transparent');
            
            // Update symbols and balance text
            document.getElementById('currency-symbol').innerText = paymentDetails[method].symbol;
            document.getElementById('balance-text').innerText = `Available Balance: ${paymentDetails[method].symbol}${availableBalance[method]}`;
            
            // Clear input on method change
            document.getElementById('amount-input').value = '';
        }

        function setMaxAmount() {
            document.getElementById('amount-input').value = availableBalance[currentMethod];
        }

        function goToNextStep() {
            const amountInput = document.getElementById('amount-input');
            const amountBox = document.getElementById('amount-box');
            const amountError = document.getElementById('amount-error');
            const amount = parseFloat(amountInput.value);
            
            amountBox.classList.remove('shake');
            amountError.classList.add('hidden');
            
            if (!amount || amount <= 0) {
                amountError.innerText = 'Please enter a valid amount!';
                amountError.classList.remove('hidden');
                
                // Trigger reflow to restart animation
                void amountBox.offsetWidth;
                amountBox.classList.add('shake');
                
                amountInput.focus();
                return;
            }
            
            // Setup View 2 based on selected method
            document.getElementById('instruction-text').innerText = paymentDetails[currentMethod].instruction;
            
            // Mask the address: show first 2 and last 2, mask rest
            let fullAddress = paymentDetails[currentMethod].address;
            let maskedAddress = fullAddress;
            if(fullAddress.length > 4) {
                maskedAddress = fullAddress.substring(0, 2) + '*'.repeat(fullAddress.length - 4) + fullAddress.substring(fullAddress.length - 2);
            }
            document.getElementById('payment-address').value = maskedAddress;
            
            document.getElementById('summary-method').innerText = currentMethod;
            document.getElementById('summary-amt').innerText = paymentDetails[currentMethod].symbol + ' ' + amount.toLocaleString();
            document.getElementById('summary-logo').src = paymentDetails[currentMethod].logo;
            
            // Slide transition
            const view1 = document.getElementById('view-1');
            const view2 = document.getElementById('view-2');
            
            view1.classList.remove('slide-in-right');
            view1.classList.add('slide-out-left');
            
            view2.classList.remove('slide-out-right', 'hidden');
            view2.classList.add('slide-in-right');
            
            document.getElementById('page-title').innerText = 'Verification';
            currentStep = 2;
        }

        function goBack() {
            if (currentStep === 2) {
                // Go back to View 1
                const view1 = document.getElementById('view-1');
                const view2 = document.getElementById('view-2');
                
                view2.classList.remove('slide-in-right');
                view2.classList.add('slide-out-right');
                
                view1.classList.remove('slide-out-left');
                view1.classList.add('slide-in-right');
                
                document.getElementById('page-title').innerText = 'Add Balance';
                currentStep = 1;
            } else {
                // Go back to home page
                if(window.parent && window.parent.loadPage) {
                    window.parent.loadPage('glassmorphic_1/code.html', window.parent.document.querySelectorAll('.nav-btn')[0]);
                }
            }
        }

        function copyAddress() {
            // Copy the real address, not the masked one
            const addr = paymentDetails[currentMethod].address;
            navigator.clipboard.writeText(addr).then(() => {
                alert('Copied to clipboard: ' + addr);
            });
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                // Show Image Preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('upload-preview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    // Hide the inner content visually
                    document.getElementById('upload-content').classList.add('hidden');
                    
                    // Show cancel button
                    document.getElementById('cancel-upload-btn').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
                
                const box = document.getElementById('upload-box');
                box.classList.remove('border-slate-200');
                box.classList.add('border-green-400', 'bg-green-50/30');
            }
        }

        function cancelUpload(event) {
            event.stopPropagation(); // Prevent opening file dialog
            
            // Reset input
            document.getElementById('file-upload').value = '';
            
            // Hide preview & cancel button
            const preview = document.getElementById('upload-preview');
            preview.src = '';
            preview.classList.add('hidden');
            document.getElementById('cancel-upload-btn').classList.add('hidden');
            
            // Show original content
            document.getElementById('upload-content').classList.remove('hidden');
            
            // Reset box styles
            const box = document.getElementById('upload-box');
            box.classList.remove('border-green-400', 'bg-green-50/30');
            box.classList.add('border-slate-200');
        }

        function submitDeposit() {
            const trxInput = document.getElementById('trx-id');
            const trxBox = document.getElementById('trx-box');
            const trxError = document.getElementById('trx-error');
            const trxId = trxInput.value;
            
            trxBox.classList.remove('shake');
            trxError.classList.add('hidden');
            
            const fileUpload = document.getElementById('file-upload');
            const uploadBox = document.getElementById('upload-box');
            const uploadError = document.getElementById('upload-error');
            
            uploadBox.classList.remove('shake');
            uploadError.classList.add('hidden');
            
            let hasError = false;

            if (!trxId || trxId.length < 8) {
                trxError.innerText = 'TrxID must be at least 8 chars!';
                trxError.classList.remove('hidden');
                
                void trxBox.offsetWidth;
                trxBox.classList.add('shake');
                hasError = true;
            }
            
            if (fileUpload.files.length === 0) {
                uploadError.innerText = 'Please upload a screenshot!';
                uploadError.classList.remove('hidden');
                
                void uploadBox.offsetWidth;
                uploadBox.classList.add('shake');
                hasError = true;
            }
            
            if (hasError) {
                if(!trxId || trxId.length < 8) trxInput.focus();
                return;
            }
            
            alert('Your deposit request has been submitted successfully! Balance will be credited after admin verification.');
            
            // Go back to home
            if(window.parent && window.parent.loadPage) {
                window.parent.loadPage('glassmorphic_1/code.html', window.parent.document.querySelectorAll('.nav-btn')[0]);
            }
        }
    </script>
</body>
</html>
