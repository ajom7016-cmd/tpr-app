        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #f6f8fb;

            -webkit-tap-highlight-color: transparent;

        /* Circular Crop Mask for Cropper.js */
        .cropper-view-box,

            border-radius: 50%;

        .cropper-view-box {
            outline: 2px solid #ea580c; /* Orange outline */
            outline-color: rgba(234, 88, 12, 0.8);
        }
        
        /* Premium Zoom Slider Customization */
        #zoom-slider {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;

        #zoom-slider::-webkit-slider-runnable-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        #zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            border: 2px solid #ea580c;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(234, 88, 12, 0.6);

            cursor: pointer;
            transition: transform 0.1s;

        #zoom-slider::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        
        /* The vibrant background aura behind the main card */
        .aura-bg {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            background: radial-gradient(ellipse at center, rgba(255, 69, 58, 0.25) 0%, rgba(255, 149, 0, 0.15) 45%, rgba(246, 248, 251, 0) 70%);
            filter: blur(40px);
            z-index: -1;
            pointer-events: none;
        }

        /* True Glassmorphism Cards */
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px৳5px rgba(0,0,0,0.05), inset 0 2px 10px rgba(255,255,255,0.3);
            border-radius: 24px;
        }

        .list-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);

            border-bottom: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 20px;

            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .list-card:active { transform: scale(0.98); }

        .btn-deposit {
            background: linear-gradient(135deg, #ff4d4d 0%, #ff8a3d 100%);
            box-shadow: 0 8px 20px rgba(255, 77, 77, 0.3);
            color: white;
            border-radius: 99px;
            padding: 7px 16px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.2s;
        }
        .btn-deposit:active { transform: scale(0.95); }

        .icon-box {
            background: #e2e8f0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #334155;
        }

        /* Horizontal Scroll Hide */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Action Buttons */
        .action-box {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05), inset 0 2px 10px rgba(255,255,255,0.5);

            backdrop-filter: blur(10px);

        <script>
            // Banner Slider Logic
            document.addEventListener('DOMContentLoaded', () => {
                const track = document.getElementById('promo-banner-track');
                if(!track) return;
                const dots = document.querySelectorAll('.promo-dot');
                let currentIdx = 0;
                setInterval(() => {
                    currentIdx = (currentIdx + 1) % 3;
                    track.style.transform = `translateX(-${currentIdx * 100}%)`;
                    dots.forEach((dot, i) => {
                        if(i === currentIdx) {
                            dot.classList.remove('w-1.5', 'bg-white/50');
                            dot.classList.add('w-4', 'bg-white');
                        } else {
                            dot.classList.remove('w-4', 'bg-white');
                            dot.classList.add('w-1.5', 'bg-white/50');
                        }
                    });
                }, 3500);
            });

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let token = localStorage.getItem('userToken'); if(!token && window.parent) try { token = window.parent.localStorage.getItem('userToken'); } catch(e) {} if(window.APP && token) {
                const profile = await window.APP.getProfile();
                if(profile) {
                    // 1. Determine VIP level and Invested Capital
                    const vipLevel = (profile.vip_plan && profile.vip_plan !== 'Free') ? parseInt(profile.vip_plan.replace('VIP ', '')) || 0 : 0;
                    // Approximate VIP Prices based on standard scaling (can be adjusted if needed)
                    const investedMap = { 0: 0, 1: 1699, 2: 3199, 3: 6190, 4: 12180, 5: 24150, 6: 48000 }; 
                    const invested = investedMap[vipLevel] || 0;
                    
                    // 2. Real Available Balance
                    const balance = profile.balance || 0;
                    
                    // 3. Real Total Portfolio Value = Balance + Invested
                    const portfolioValue = balance + invested;
                    
                    // Update DOM
                    document.getElementById('user-balance').innerText = portfolioValue.toLocaleString('en-IN', {minimumFractionDigits: 2}); // Portfolio
                    document.getElementById('today-income').innerText = balance.toLocaleString('en-IN', {minimumFractionDigits: 2}); // Available Balance
                    document.getElementById('user-invested').innerText = invested.toLocaleString('en-IN', {minimumFractionDigits: 2}); // Invested Capital

                    for (const task of finalTasks) {
                        let icon = svgMap[task.type] || svgMap['default'];
                        let name = nameMap[task.type] || (task.type ? (task.type.charAt(0).toUpperCase() + task.type.slice(1) + ' Task') : 'Task');
                        
                        let timeStr = '00:00';
                        if (task.completed_at) {
                            let timeString = task.completed_at;
                            if (typeof timeString === 'string' && !timeString.endsWith('Z') && !timeString.includes('T')) {
                                timeString = timeString.replace(' ', 'T') + 'Z';
                            } else if (typeof timeString === 'string' && !timeString.endsWith('Z')) {
                                timeString += 'Z';
                            }
                            let dateObj = new Date(timeString);
                            timeStr = dateObj.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
                        }
                        
                        let rewardHtml = task.reward > 0 
                            ? `<span class="block text-[14px] font-black text-green-600">+ ৳ ${task.reward}</span>` 
                            : `<span class="block text-[14px] font-black text-slate-400">00</span>`;
                        
                        html += `
                        <div class="list-card p-3 h-[72px] flex items-center justify-between searchable-item relative overflow-hidden">
                            <div class="flex items-center gap-2 sm:gap-3 z-10">
                                ${icon}
                                <div>
                                    <h4 class="text-[14px] font-bold text-slate-800 leading-tight whitespace-nowrap tracking-tight">${name}</h4>
                                    <span class="text-[11px] font-bold text-slate-500 block mt-0.5">${timeStr}</span>
                                </div>
                            </div>
                            <div class="text-right shrink-0 absolute right-3 bottom-3 z-10">
                                ${rewardHtml}
                            </div>
                        </div>
                        `;
                    }
                    
                    document.getElementById('recent-earnings-container').innerHTML = html;
                }
            }

            
            
            setTimeout(() => {
                const container = document.getElementById('recent-earnings-container');
                if (container && container.innerHTML.trim() === '') {
                    container.innerHTML = '<div class="col-span-2 text-center text-slate-400 py-6 font-medium text-[13px]">No tasks completed today.</div>';
                }
            }, 800);


            window.addEventListener('scroll', () => {
                if (window.parent) {
                    window.parent.postMessage({
                        type: 'scroll',
                        scrollY: window.scrollY
                    }, '*');
                }
            });
        });
    </script>
</body>
</html>
